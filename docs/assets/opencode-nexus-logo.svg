<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">OpenCode Nexus</title>
  <desc id="description">A dark geometric OpenCode Nexus wordmark with a connected-node symbol.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d7ff"/>
      <stop offset="0.52" stop-color="#b6f0ff"/>
      <stop offset="1" stop-color="#ff8062"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa0b8" stroke-opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#080c11"/>
  <rect x="20" y="20" width="1160" height="380" rx="18" fill="url(#surface)" stroke="#2b3949" stroke-width="2"/>

  <rect x="48" y="48" width="1104" height="228" rx="10" fill="#131c26" stroke="#263444"/>
  <rect x="48" y="48" width="1104" height="228" rx="10" fill="url(#grid)"/>

  <g fill="#8ea4ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="3">
    <text x="76" y="82">OPEN-CODE / ORCHESTRATION LAYER</text>
    <text x="1124" y="82" text-anchor="end">GRAPH-BACKED</text>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="148" font-weight="900" letter-spacing="14">
    <text x="600" y="216" fill="none" stroke="#ff8062" stroke-width="3" opacity="0.95" transform="translate(8 8)">NEXUS</text>
    <text x="600" y="216" fill="none" stroke="#45d7ff" stroke-width="3" opacity="0.95" transform="translate(-8 -8)">NEXUS</text>
    <text x="600" y="216" fill="#edf4fa" stroke="#080c11" stroke-width="12" paint-order="stroke">NEXUS</text>
    <text x="600" y="216" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.82">NEXUS</text>
  </g>

  <g opacity="0.8" stroke-linecap="round">
    <path d="M78 246H260M940 246H1122" stroke="#45d7ff" stroke-opacity="0.55"/>
    <path d="M78 250H184M1016 250H1122" stroke="#ff8062" stroke-opacity="0.55"/>
    <circle cx="260" cy="246" r="3" fill="#45d7ff"/>
    <circle cx="940" cy="246" r="3" fill="#ff8062"/>
  </g>

  <g transform="translate(458 310)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46V10L54 46V10" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <path d="M14 10L34 28L54 10M14 46L34 28L54 46" fill="none" stroke="#edf4fa" stroke-opacity="0.86" stroke-width="2.5"/>
    <circle cx="14" cy="10" r="5" fill="#45d7ff" stroke="#080c11" stroke-width="2"/>
    <circle cx="54" cy="10" r="5" fill="#ff8062" stroke="#080c11" stroke-width="2"/>
    <circle cx="14" cy="46" r="5" fill="#ff8062" stroke="#080c11" stroke-width="2"/>
    <circle cx="54" cy="46" r="5" fill="#45d7ff" stroke="#080c11" stroke-width="2"/>
    <circle cx="34" cy="28" r="6" fill="#edf4fa" stroke="#080c11" stroke-width="3"/>
  </g>

  <text x="544" y="348" fill="#edf4fa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="750" letter-spacing="-1">OpenCode Nexus</text>
  <text x="548" y="378" fill="#8ea4ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">PLAN  •  MAP  •  BUILD  •  REVIEW</text>
</svg>
