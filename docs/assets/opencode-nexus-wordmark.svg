<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">OpenCode Nexus wordmark</title>
<desc id="desc">OpenCode Nexus wordmark with a geometric network N logo.</desc>
<defs>
  <linearGradient id="g" x1="80" y1="80" x2="500" y2="500" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#39D7FF"/>
    <stop offset="0.5" stop-color="#72E6FF"/>
    <stop offset="1" stop-color="#FF7B63"/>
  </linearGradient>
</defs>
<rect width="1600" height="520" rx="44" fill="#080D13"/>

<!-- compact icon -->
<g transform="translate(54,42) scale(.43)">
  <path d="M512 72 832 256 832 624 512 808 192 624 192 256Z"
        fill="#0B1118" stroke="#1C2A37" stroke-width="24" stroke-linejoin="round"/>
  <path d="M512 103 805 272 805 608 512 777 219 608 219 272Z"
        fill="none" stroke="url(#g)" stroke-width="12" stroke-linejoin="round"/>
  <g stroke="#2B4354" stroke-width="12" stroke-linecap="round">
    <path d="M512 440 512 218"/><path d="M512 440 704 329"/><path d="M512 440 704 551"/>
    <path d="M512 440 512 662"/><path d="M512 440 320 551"/><path d="M512 440 320 329"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M328 616V304" stroke="#F4FAFF" stroke-width="58"/>
    <path d="M696 616V304" stroke="#F4FAFF" stroke-width="58"/>
    <path d="M328 304 696 616" stroke="url(#g)" stroke-width="66"/>
  </g>
  <g stroke="#0B1118" stroke-width="18">
    <circle cx="328" cy="304" r="34" fill="#39D7FF"/>
    <circle cx="328" cy="616" r="34" fill="#F4FAFF"/>
    <circle cx="696" cy="304" r="34" fill="#F4FAFF"/>
    <circle cx="696" cy="616" r="34" fill="#FF7B63"/>
  </g>
  <circle cx="512" cy="460" r="54" fill="#0B1118" stroke="url(#g)" stroke-width="18"/>
  <circle cx="512" cy="460" r="17" fill="#F7FBFF"/>
</g>

<!-- wordmark -->
<text x="500" y="212" fill="#91A6B7"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="50" font-weight="700" letter-spacing="8">OPENCODE</text>
<text x="492" y="355" fill="#F4FAFF"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="154" font-weight="900" letter-spacing="-5">NEXUS</text>
<rect x="500" y="392" width="565" height="8" rx="4" fill="url(#g)"/>
<text x="500" y="444" fill="#6F8596"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="24" font-weight="700" letter-spacing="4">PLAN · MAP · BUILD · REVIEW</text>
</svg>