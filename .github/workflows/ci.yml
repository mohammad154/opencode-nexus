name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "lts/*"]
        exclude:
          # Node 20 on macOS truncates piped child stdout at 8 KiB (spawnSync).
          - os: macos-latest
            node: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
        shell: bash
      - name: Reviewer quality eval
        run: node bin/nexus.js eval reviewer --json
        shell: bash

  install:
    name: Installer isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer regression
        run: bash scripts/test-install-only.sh
      - name: Optional agents demotion
        run: bash scripts/test-optional-agents.sh
      - name: Uninstall lifecycle
        run: bash scripts/test-uninstall-lifecycle.sh
      - name: Install OpenCode 1.19.6 for the real parser test
        run: npm install --prefix "$RUNNER_TEMP/opencode" --no-save opencode-ai@1.19.6
        shell: bash
      - name: Agent frontmatter loads in OpenCode
        run: node --test tests/review3-frontmatter.test.js
        env:
          NEXUS_OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
        shell: bash

  ci:
    name: CI
    if: ${{ always() }}
    needs: [test, install]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required CI job did not pass
        if: ${{ needs.test.result != 'success' || needs.install.result != 'success' }}
        run: exit 1
      - name: Confirm required CI jobs passed
        run: echo "All CI jobs passed"
