name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test tests/schema/*.test.js tests/migrate/*.test.js tests/classify/*.test.js tests/state-machine/*.test.js tests/drift/*.test.js tests/blast/*.test.js
        shell: bash

  install:
    name: Installer isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer regression
        run: bash scripts/test-install-only.sh
      - name: Optional agents demotion
        run: bash scripts/test-optional-agents.sh
